title: 150 words version
content: >-
  Chengxuan Li is a PhD candidate in Systems Engineering at Cornell University, with a minor in Electrical and
  Computer Engineering. His research combines machine learning, scientific computing, simulation, and optimization
  for urban energy and power systems. At Cornell’s Environmental Systems Lab, he develops data-driven and
  physics-informed methods for load inference, model calibration, smart-meter and grid-data analytics, demand-response
  assessment, and scalable urban energy simulation. His work integrates physical models with statistical and
  machine-learning approaches to study building demand, feeder-level behavior, electrification, distributed energy
  resources, and grid flexibility. He is also Lead Developer of EnergyAtlas.io, a city-scale utility digital twin and
  energy simulation platform integrating building models, geospatial data, smart-meter observations, and physical
  simulation. His broader skills include AI for engineering, inverse modeling, system identification, reduced-order
  modeling, energy-system optimization, and practical software tools for infrastructure planning and decarbonization.
