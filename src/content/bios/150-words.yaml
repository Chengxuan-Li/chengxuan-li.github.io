title: 150 words version
content: >-
  Chengxuan Li is a PhD candidate in Systems Engineering at Cornell University, with a minor in Electrical and
  Computer Engineering. He works in Cornell’s Environmental Systems Lab, where his research combines machine
  learning, inverse modeling, surrogate learning, and simulation for urban energy systems. He develops methods for
  load-profile inference and smart-meter calibration of urban building energy models, with an emphasis on scalable
  computation and uncertainty in non-unique solutions. Chengxuan is Lead Developer of EnergyAtlas.io, a city-scale
  digital twin and energy simulation platform built in C# and .NET. His work there spans simulation, geometry, data,
  and visualization architecture, integrating building models, geospatial data, smart-meter observations, LiDAR,
  shading analysis, and time-series processing. Across these efforts, he studies urban energy demand, demand response,
  load flexibility, renewable-energy integration, and software infrastructure needed to support building- and
  city-scale decarbonization analysis. Before Cornell, he studied architecture at the Architectural Association and
  worked in environmental engineering consultancy.
