title: 100 words version
content: >-
  Chengxuan Li is a PhD candidate in Systems Engineering at Cornell University, with a minor in Electrical and
  Computer Engineering. His work focuses on machine learning, inverse modeling, surrogate learning, and simulation
  for urban energy systems. At Cornell’s Environmental Systems Lab, he develops load-profile inference methods and
  calibration workflows for urban building energy models. As Lead Developer of EnergyAtlas.io, he designs software
  that integrates building models, geospatial data, smart-meter observations, and physical simulation into a
  city-scale digital twin. His broader research addresses building-energy demand, demand response, load flexibility,
  scalable urban simulation, and practical tools for building- and city-scale decarbonization planning.
