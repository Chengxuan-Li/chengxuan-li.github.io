abstract: >-
  Calibration of physics-based building energy models is commonly formulated as an optimization or Bayesian inference problem in which uncertain model inputs are iteratively updated until simulated outputs agree with observations. At urban scale, repeatedly solving the calibration problem for individual buildings incurs substantial computational cost and limits large-scale deployment, while direct inverse inference from energy observations faces the problem of equifinality: multiple combinations of envelope, system, and schedule parameters may produce similar load profiles. This study proposes a physics-supervised amortized inverse calibration framework for scalable smart-meter calibration of reduced-order urban building energy models.

  The framework is developed around a 5R1C building energy model. Synthetic simulations are generated by sampling uncertain physical, system, and schedule parameters under varying weather and building conditions. An inverse surrogate is trained to infer plausible calibration parameters from hourly electricity and gas profiles and known boundary conditions, where simulator-derived intermediate thermal states, including zone air and thermal-mass temperatures, provide auxiliary supervision during synthetic training.

  A structured ablation study evaluates four progressively enriched inverse models: (1) a deterministic inverse baseline, establishing parameter-recovery performance without additional constraints; (2) auxiliary internal-state supervision, testing whether internal thermal-state targets improve internal state recovery; (3) forward-simulation consistency, testing whether inferred parameters reproduce the observed energy trajectories; and (4) probabilistic inverse inference, testing whether the model captures uncertainty and non-identifiable parameter combinations. The tests are compared using model input parameter recovery (the agreement between known synthetic inputs and predicted inputs), internal-state reconstruction (the agreement between simulated internal states and predicted states), forward reconstruction (the agreement between the original simulated energy outputs and the ones obtained by re-simulating the model with parameters predicted by the inverse model), uncertainty representation, and generalization to unseen observations, thereby isolating the contribution of each added component.

  The method is subsequently deployed across approximately 40,000 buildings with one year of hourly electricity and gas smart-meter data. Real-world performance is evaluated using meter held-out observations, while conventional iterative calibration on a representative subset provides an accuracy and computational-cost benchmark.

  The study investigates whether physics-supervised amortized inference can address the computational and identifiability challenges of building-by-building calibration while retaining uncertainty in non-unique solutions, enabling smart-meter-calibrated urban building energy models at building-stock scale.
