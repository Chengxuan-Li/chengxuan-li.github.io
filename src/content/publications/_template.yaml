# Copy to src/content/publications/<slug>.yaml. The file name is the publication id used by news items.
title: Full title of the paper
authors: # in publication order, as printed
  - A. Author
  - C. Li
year: 2026
# month: 5                    # (optional) 1–12
status: submitted             # published | in-press | accepted | submitted | preprint | in-preparation
type: journal                 # journal | conference | workshop | preprint | thesis | report | other
venue: null                   # journal or conference name, or null until known
# doi: 10.1000/xyz123         # (optional) bare DOI
links: {}                     # the first link below (paper, then preprint, code, slides, poster) makes
                              # the title clickable on the news page; a bare `doi` does not
# links:
#   paper: https://...
#   preprint: https://...
#   code: https://...
#   slides: https://...
#   poster: https://...
project_ids: []               # project folder names this paper belongs to
featured: false               # true to list under "Selected publications" on the home page (then set home_order)
# home_order: 1
# note: Equal contribution.   # (optional) shown after the citation
