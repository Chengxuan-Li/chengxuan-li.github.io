summary: Lead development of a city-scale energy digital twin and simulation platform in C#/.NET for building, utility, and urban energy analysis.
bullets:
  - Design and develop the core software architecture for building-energy simulation, geospatial modeling, time-series processing, and large-scale urban analysis.
  - Develop scalable reduced-order building energy simulation and calibration workflows integrating physical models with smart-meter and other observational data.
  - Build data pipelines for building geometry, LiDAR, weather, schedules, utility data, and other heterogeneous urban datasets.
  - Develop computational methods for solar and shading analysis, geometric processing, model parameterization, and city-scale simulation.
  - Design software infrastructure for large-scale scenario analysis of electrification, energy demand, peak loads, demand response, and grid flexibility.
  - Develop APIs, Python interfaces, data models, and visualization workflows supporting reproducible analysis and integration with external research and planning tools.
