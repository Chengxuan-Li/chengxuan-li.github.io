# Copy to src/content/experiences/<slug>.yaml.
organization:
  en: Organization name
  # zh: 机构名称
role:
  en: Role title
  # zh: 职位名称
type: research                # research | professional | teaching | service (selects the CV section)
start_date: 2024-08           # YYYY, YYYY-MM, or YYYY-MM-DD
end_date: null                # null while current
location: null                # "City, Country" or null
# url: https://...            # (optional)
featured: false               # true to show under "Selected experience" on the home page
# cv_order: 1                 # (optional) manual position; otherwise current roles first, then most recent
project_ids: []               # related project folder names
summary: null                 # or { en: ..., zh: ... }; omitted zh falls back to English
bullets: []                   # each item may be { en: ..., zh: ... }
