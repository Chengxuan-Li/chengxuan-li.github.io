<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Grid C favicon on dark background">
  <defs>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f7cff"/>
      <stop offset="100%" stop-color="#1b63f0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="36" fill="#03122d"/>

  <!-- Grid boundary -->
  <g transform="translate(91,91)">
    <!-- grid panel -->
    <rect x="0" y="0" width="330" height="330" fill="none" stroke="#0b2248" stroke-width="4"/>
    <!-- vertical grid lines -->
    <line x1="110" y1="0" x2="110" y2="330" stroke="#0b2248" stroke-width="4"/>
    <line x1="220" y1="0" x2="220" y2="330" stroke="#0b2248" stroke-width="4"/>
    <!-- horizontal grid lines -->
    <line x1="0" y1="110" x2="330" y2="110" stroke="#0b2248" stroke-width="4"/>
    <line x1="0" y1="220" x2="330" y2="220" stroke="#0b2248" stroke-width="4"/>

    <!-- C tiles -->
    <g fill="url(#tileBlue)" filter="url(#softGlow)">
      <!-- top row -->
      <rect x="0" y="0" width="110" height="110"/>
      <rect x="110" y="0" width="110" height="110"/>
      <rect x="220" y="0" width="110" height="110"/>
      <!-- middle left -->
      <rect x="0" y="110" width="110" height="110"/>
      <!-- bottom row -->
      <rect x="0" y="220" width="110" height="110"/>
      <rect x="110" y="220" width="110" height="110"/>
      <rect x="220" y="220" width="110" height="110"/>
    </g>
  </g>
</svg>
